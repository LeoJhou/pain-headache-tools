<html lang="zh-Hant" class="staticrypt-html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>需要密碼</title>
<style>
:root { color-scheme: light dark; --bg: #fff; --ink: #15202c; --muted: #55636f; --line: #cfd7df; --line-strong: #15202c; --blue: #123f75; --on-blue: #fff; --err: #a8231c; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #12181f; --ink: #e7ecf1; --muted: #9dabb8; --line: #35414d; --line-strong: #e7ecf1; --blue: #93bbea; --on-blue: #0e1620; --err: #f49c93; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; font-size: 16px; line-height: 1.45; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 32px; }
.hidden { display: none !important; }
.back { display: inline-flex; align-items: center; min-height: 44px; color: var(--blue); font-size: 15px; text-decoration: none; }
h1 { margin: 0; padding-bottom: 12px; border-bottom: 2px solid var(--line-strong); font-size: 23px; line-height: 1.25; font-weight: 600; }
label.pw { display: block; margin-top: 18px; font-size: 14px; color: var(--muted); }
#staticrypt-password { display: block; width: 100%; height: 48px; margin-top: 4px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--bg); color: var(--ink); font: inherit; font-size: 18px; letter-spacing: .1em; }
.err { margin: 8px 0 0; color: var(--err); font-size: 14px; }
.rem { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-top: 8px; font-size: 15px; }
.rem input { width: 20px; height: 20px; margin: 0; accent-color: var(--blue); }
.go { display: block; width: 100%; height: 48px; margin-top: 8px; border: 0; border-radius: 4px; background: var(--blue); color: var(--on-blue); font: inherit; font-weight: 600; cursor: pointer; }
.go:disabled { opacity: .6; }
#staticrypt_loading { padding: 24px 0; color: var(--muted); }
</style>
</head>
<body class="staticrypt-body">
<main>

  <p id="staticrypt_loading">載入中</p>

        <input id="staticrypt-password" type="password" name="password" inputmode="numeric" autocomplete="current-password" autofocus>
      </label>
      <p class="err hidden" id="pwError" role="alert">密碼不對</p>
      <label id="staticrypt-remember-label" class="rem hidden">
        <input id="staticrypt-remember" type="checkbox" name="remember">
        這台裝置記住 30 天
